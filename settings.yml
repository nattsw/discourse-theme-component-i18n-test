resource_sections:
  type: objects
  default:
    - key: getting_started
      title: Resources
      links:
        - key: guidelines
          label: Community guidelines
          description: Learn how to take part in the community.
          url: /guidelines
          icon: book
        - key: about
          label: About this community
          description: Meet the people behind this space.
          url: /about
          icon: circle-info
  schema:
    name: resource_section
    identifier: title
    translation_key_preview:
      prefix: community_resources
      key: key
      fields:
        - title
    properties:
      key:
        type: string
        required: true
        validations:
          min_length: 1
          max_length: 80
      title:
        type: string
        required: true
      links:
        type: objects
        schema:
          name: resource_link
          identifier: label
          translation_key_preview:
            key: key
            fields:
              - label
              - description
          properties:
            key:
              type: string
              required: true
              validations:
                min_length: 1
                max_length: 80
            label:
              type: string
              required: true
            description:
              type: string
              textarea: true
            url:
              type: string
              required: true
              validations:
                url: true
            icon:
              type: enum
              default: link
              choices:
                - link
                - book
                - circle-info
