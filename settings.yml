welcome_cards:
  type: objects
  default:
    - identifier: introductions
      title: Introduce yourself
      description: Tell us a little about yourself and meet other members.
      button_text: Say hello
      destination: /latest
    - identifier: questions
      title: Ask a question
      description: Get help and share what you know with the community.
      button_text: Explore discussions
      destination: /categories
    - identifier: guidelines
      title: Feel at home
      description: Learn how we keep this a welcoming place for everyone.
      button_text: Read our guidelines
      destination: /guidelines
  schema:
    name: welcome_card
    identifier: title
    properties:
      identifier:
        type: string
        required: true
        validations:
          min_length: 1
          max_length: 80
      title:
        type: string
        translatable: true
        required: true
      description:
        type: string
        translatable: true
        textarea: true
      button_text:
        type: string
        translatable: true
        required: true
      destination:
        type: string
        required: true
        validations:
          url: true
