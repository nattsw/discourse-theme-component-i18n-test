welcome_cards:
  type: objects
  default:
    - translation_identifier: introductions
      title: Introduce yourself
      description: Tell us a little about yourself and meet other members.
      button_text: Say hello
      destination: /latest
    - translation_identifier: questions
      title: Ask a question
      description: Get help and share what you know with the community.
      button_text: Explore discussions
      destination: /categories
    - translation_identifier: guidelines
      title: Feel at home
      description: Learn how we keep this a welcoming place for everyone.
      button_text: Read our guidelines
      destination: /guidelines
  schema:
    name: welcome_card
    identifier: title
    translations:
      key: translation_identifier
      fields: [title, description, button_text]
    properties:
      translation_identifier:
        type: string
        required: true
        validations:
          min_length: 1
          max_length: 80
      title:
        type: string
        required: true
      description:
        type: string
        textarea: true
      button_text:
        type: string
        required: true
      destination:
        type: string
        required: true
        validations:
          url: true
