en:
  welcome_heading: Welcome to our community
  welcome_message: Find your way around and join the conversation.
  theme_metadata:
    description: A welcome panel with editable cards to help newcomers find their way around.
    settings:
      welcome_cards:
        description: "Add welcome cards and choose where their buttons lead. Replace the example destinations with pages on your forum."
        schema:
          properties:
            identifier:
              label: Identifier
              description: "Use a unique name such as introductions, starting with a lowercase letter and containing only lowercase letters, numbers, and underscores. Keep it unchanged to preserve translations. Choose a new identifier when duplicating a card."
            title:
              label: Card title
            description:
              label: Card description
            button_text:
              label: Button text
            destination:
              label: Button destination
              description: "Enter a page address, such as /guidelines or the address of your introductions topic."
